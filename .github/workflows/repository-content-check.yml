name: Repository Content Check

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  repository-content-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run repository-content-check
        run: nix develop -c scripts/repository-content-check
