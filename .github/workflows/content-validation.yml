name: Content Validation

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  content-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js # necessary for Markdownlinter
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --only dev --no-interaction

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2

      - name: Run codespell
        run: poetry run codespell

      - name: Run yamllint
        run: poetry run yamllint .

      - name: Validate rules
        run: poetry run yamale -s schemas/rule.schema.yaml rules

      - name: Validate profiles
        run: poetry run yamale -s schemas/profile.schema.yaml profiles

      - name: Run markdownlint
        run: npx markdownlint-cli2 "**/*.md"
