name: Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaitai Struct compiler
        run: |
          curl --fail --location --show-error \
            --output /tmp/kaitai-struct-compiler.deb \
            https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler_0.11_all.deb
          sudo apt-get update
          sudo apt-get install --yes /tmp/kaitai-struct-compiler.deb

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Generate Kaitai parser
        run: scripts/generate-kaitai

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Run Pylint
        run: PYLINTHOME=.pylint.d poetry run pylint src tests

      - name: Run mypy
        run: poetry run mypy --strict src tests

      - name: Run Bandit
        run: poetry run bandit -c bandit.yaml -r src

      - name: Run ShellCheck
        run: shellcheck scripts/*

      - name: Run Radon
        run: poetry run radon cc src --show-complexity

      - name: Run Ruff format check
        run: poetry run ruff format --check src tests

      - name: Run tests
        run: poetry run pytest
