name: Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Initialize coverage evidence path
        shell: bash
        run: |
          evidence_dir="$RUNNER_TEMP/coverage-diagnostics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "COVERAGE_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run quality gate
        run: nix develop -c scripts/quality-gate

      - name: Collect coverage diagnostics
        if: always()
        shell: bash
        run: |
          if command -v nix >/dev/null 2>&1; then
            nix develop -c scripts/coverage-diagnostics --output-dir "$COVERAGE_EVIDENCE_DIR"
          else
            mkdir -p "$COVERAGE_EVIDENCE_DIR"
            echo "Coverage diagnostics unavailable: Nix was not installed successfully." \
              | tee "$COVERAGE_EVIDENCE_DIR/availability.txt"
            exit 1
          fi

      - name: Upload coverage evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-diagnostics
          path: ${{ env.COVERAGE_EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 7
